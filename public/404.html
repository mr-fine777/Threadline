<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#431d58">
  <title>Page not found | Threadline</title>
  <link rel="icon" href="img/iconic.png" type="image/png">
  <link rel="stylesheet" href="error.css">
</head>
<body class="error-page">
  <header class="error-header">
    <a class="error-brand" href="/" aria-label="Threadline home"><img src="img/img.png" alt=""><span>Threadline</span></a>
  </header>
  <main class="error-main">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code">Error 404</p>
      <h1 id="error-title">Looks like this page slipped out of the thread.</h1>
      <p class="error-copy">We couldn’t find the page you were looking for. The link may be old, or the address may have a typo.</p>
      <div class="error-actions">
        <a class="error-button" href="/">Back to Threadline</a>
        <a class="error-button secondary" href="/blog.html">Visit the blog</a>
      </div>
    </section>
  </main>
  <footer class="error-footer">Need a hand? <a href="/contact.html">Contact Threadline support</a>.</footer>
</body>
</html>
