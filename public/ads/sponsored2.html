<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sponsored Listing - Threadline</title>
	<style>
		body { font-family: Arial, sans-serif; background: #f9f6ff; color: #53216e; margin: 0; padding: 0; }
		.container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(83,33,110,0.08); padding: 32px; }
		h1 { text-align: center; }
		.thumbs { display: flex; flex-direction: column; align-items: center; gap: 24px; margin: 32px 0; }
		.thumbs img { border-radius: 8px; box-shadow: 0 1px 8px rgba(83,33,110,0.10); max-width: 100%; }
		.meta { margin-top: 24px; }
		.meta strong { display: inline-block; width: 100px; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Sponsored Listing</h1>
		<div id="listing">
			<div>Loading...</div>
		</div>
	</div>
	<script>
		// Fetch a random sponsored listing (update endpoint as needed)
		fetch('https://www.rbxthread.app/api/listings/random')
			.then(res => res.ok ? res.json() : null)
			.then(entry => {
				if (!entry) {
					document.getElementById('listing').innerHTML = '<div>Failed to load listing.</div>';
					return;
				}
				document.getElementById('listing').innerHTML = `
					<div class="thumbs">
						<div>
							<strong>Icon (thumbUrl):</strong><br>
							${entry.thumbUrl ? `<img src="${entry.thumbUrl}" alt="Icon" style="max-width:150px;max-height:150px;">` : '<em>No icon</em>'}
						</div>
						<div>
							<strong>Thumbnail (thumbUrl2):</strong><br>
							${entry.thumbUrl2 ? `<img src="${entry.thumbUrl2}" alt="Thumbnail" style="max-width:384px;max-height:216px;">` : '<em>No thumbnail</em>'}
						</div>
					</div>
					<div class="meta">
						<div><strong>Game:</strong> ${entry.title || ''}</div>
						<div><strong>Author:</strong> ${entry.author || ''}</div>
						<div><strong>Likes:</strong> ${typeof entry.likes === 'number' ? entry.likes : ''}</div>
						<div><strong>Impressions:</strong> ${entry.impressions || 0}</div>
						<div><strong>Clicks:</strong> ${entry.clicks || 0}</div>
						<div><strong>Place ID:</strong> ${entry.placeId || ''}</div>
						<div><strong>Code:</strong> ${entry.code || ''}</div>
					</div>
				`;
			})
			.catch(() => {
				document.getElementById('listing').innerHTML = '<div>Failed to load listing.</div>';
			});
	</script>
</body>
</html>
