<script>
(function(){
  // Dropdown menu logic
  const toggle = document.getElementById('menuToggle');
  const menu = document.getElementById('subheaderMenu');
  if (!toggle || !menu) return;
  function setOpen(open) {
    const show = !!open;
    menu.classList.toggle('open', show);
    toggle.setAttribute('aria-expanded', show);
    menu.setAttribute('aria-hidden', !show);
  }
  setOpen(menu.classList.contains('open'));
  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    setOpen(!menu.classList.contains('open'));
  });
  document.addEventListener('click', function(e){
    if (!menu.contains(e.target) && e.target !== toggle) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') setOpen(false);
  });
})();

// Blog post logic
document.addEventListener('DOMContentLoaded', function() {
  // Helper: get slug from URL (?slug=...)
  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  // Fetch blogpost.json and display post if valid
  const slug = getSlug();
  if (!slug) {
    window.location.href = 'index.html';
    return;
  }
  fetch('posts/blogpost.json')
    .then(r => r.json())
    .then(data => {
      const posts = data.BlogPosts || [];
      const post = posts.find(p => p.slug === slug);
      if (!post) {
        window.location.href = 'index.html';
        return;
      }
      // Render post with newlines preserved as <br>
      const container = document.getElementById('post-container');
      // Replace newlines with <br> for HTML rendering
      
      const article = document.createElement('article');
      article.className = 'specific-post';
      const content = document.createElement('div');
      content.className = 'post-content';
      const title = document.createElement('h1');
      title.id = 'title';
      title.textContent = post.title || 'Threadline article';
      content.appendChild(title);
      if (post.image) {
        const image = document.createElement('img');
        image.id = 'image';
        image.src = post.image;
        image.alt = post.imageAlt || (post.title ? 'Illustration for ' + post.title : 'Blog article illustration');
        image.loading = 'eager';
        content.appendChild(image);
      }
      const body = document.createElement('div');
      body.id = 'body';
      body.className = 'article-body';
      post.body.split(/\n\s*\n/).forEach(function (paragraph) {
        const text = paragraph.trim();
        if (!text) return;
        if (/^##\s+/.test(text)) {
          const heading = document.createElement('h2');
          heading.textContent = text.replace(/^##\s+/, '');
          body.appendChild(heading);
        } else {
          const p = document.createElement('p');
          p.textContent = text;
          body.appendChild(p);
        }
      });
      content.appendChild(body);
      article.appendChild(content);
      container.replaceChildren(article);
      const byline = document.createElement('p');
      byline.className = 'article-byline';
      byline.textContent = 'By Threadline · Updated November 10, 2026';
      title.insertAdjacentElement('afterend', byline);
      document.title = (post.title || 'Threadline article') + ' | Threadline';
      let canonical = document.querySelector('link[rel="canonical"]');
      if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.appendChild(canonical); }
      canonical.href = window.location.origin + window.location.pathname + '?slug=' + encodeURIComponent(slug);
      const articleSchema = document.createElement('script');
      articleSchema.type = 'application/ld+json';
      articleSchema.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'Article', headline: post.title,
        author: { '@type': 'Organization', name: 'Threadline', url: 'https://www.rbxthread.app/#about' },
        publisher: { '@type': 'Organization', name: 'Threadline', url: 'https://www.rbxthread.app/' },
        mainEntityOfPage: canonical.href, dateModified: '2026-11-10'
      });
      document.head.appendChild(articleSchema);

      const description = document.querySelector('meta[name="description"]');
      if (description) description.content = (post.body || '').replace(/\s+/g, ' ').slice(0, 155);
      container.style.position = 'relative';
    })
    .catch(() => {
      window.location.href = 'index.html';
    });
});
