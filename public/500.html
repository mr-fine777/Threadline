<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#431d58">
  <title>Something went wrong | Threadline</title>
  <link rel="icon" href="img/iconic.png" type="image/png">
  <link rel="stylesheet" href="error.css">
</head>
<body class="error-page">
  <header class="error-header">
    <a class="error-brand" href="/" aria-label="Threadline home"><img src="img/img.png" alt=""><span>Threadline</span></a>
  </header>
  <main class="error-main">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code">Error 500</p>
      <h1 id="error-title">We hit a snag on our end.</h1>
      <p class="error-copy">Something went wrong while loading this page. Please try again in a moment, or head back to Threadline.</p>
      <div class="error-actions">
        <a class="error-button" href="/">Back to Threadline</a>
        <a class="error-button secondary" href="/contact.html">Contact support</a>
      </div>
    </section>
  </main>
  <footer class="error-footer">Thanks for your patience while we get things back on track.</footer>
</body>
</html>
